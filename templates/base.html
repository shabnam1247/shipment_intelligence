<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Shipment Intelligence
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🚚 Shipment AI
        </div>

        <div class="nav-links">

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('shipments') }}">
                Shipments
            </a>

            <a href="{{ url_for('predictions') }}">
                Predictions
            </a>

            <a href="{{ url_for('anomalies') }}">
                Anomalies
            </a>

            <a href="{{ url_for('upload') }}">
                Upload Data
            </a>

        </div>

    </nav>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
